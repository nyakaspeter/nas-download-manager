name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm package:sources

      - name: Get version from manifest
        id: version
        run: node -e "console.log('version=' + require('./manifest.json').version)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest
        run: test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          make_latest: true
