name: Submit to Web Stores

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-store-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm package:sources

      - name: Get version from manifest
        id: version
        run: node -e "console.log('version=' + require('./manifest.json').version)" >> "$GITHUB_OUTPUT"

      - name: Submit extension
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ secrets.SUBMIT_KEYS }}
          artifact: artifacts/nas-download-manager-${{ steps.version.outputs.version }}.zip
          source: artifacts/nas-download-manager-${{ steps.version.outputs.version }}-sources.zip
          version-file: manifest.json
