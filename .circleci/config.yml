version: 2
jobs:
  build:
    working_directory: ~/nas-download-manager
    docker:
      - image: cimg/node:22.18.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install --global pnpm@11.19.0
      - run:
          name: Configure pnpm store
          command: pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-packages-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Test
          command: pnpm test
